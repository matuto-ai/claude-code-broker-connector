name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: claude-code-review-pair
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: matuto-ai/psst
          ref: 72f5d2d1b834e02cfb6b2f7dc11c6f1a55729344
          path: ai-agent-msg-broker
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Check source syntax
        run: npm run check
        working-directory: claude-code-review-pair
      - name: Run local tests
        run: npm run test:local
        working-directory: claude-code-review-pair
      - name: Verify native host and protocol integration
        run: npm run test:integration
        working-directory: claude-code-review-pair
      - name: Verify container persistence
        run: |
          docker build -f integration/Containerfile -t psst-claude-fixture:local .
          PSST_TEST_DOCKER=psst-claude-fixture:local node --test integration/container-approval.test.mjs
        working-directory: claude-code-review-pair
      - name: Verify installable package
        run: npm run test:pack
        working-directory: claude-code-review-pair
