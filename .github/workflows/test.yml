name: connector-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: claude-code-review-pair
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: matuto-ai/psst
          ref: 72f5d2d1b834e02cfb6b2f7dc11c6f1a55729344
          path: ai-agent-msg-broker
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - run: npm run check && npm test && npm run test:integration
        working-directory: claude-code-review-pair
  container-approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: claude-code-review-pair
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/psst
          ref: 72f5d2d1b834e02cfb6b2f7dc11c6f1a55729344
          path: ai-agent-msg-broker
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Build isolated nonroot connector fixture
        run: docker build -f integration/Containerfile -t psst-claude-fixture:local .
        working-directory: claude-code-review-pair
      - name: Recreate containers retaining only approved installation volume
        run: node --test integration/container-approval.test.mjs
        working-directory: claude-code-review-pair
        env:
          PSST_TEST_DOCKER: psst-claude-fixture:local
