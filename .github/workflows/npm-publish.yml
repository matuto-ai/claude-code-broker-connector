name: Publish npm package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Verify release version and source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs";const p=JSON.parse(fs.readFileSync("package.json"));if(process.env.RELEASE_TAG!==`v${p.version}`)throw Error("Tag must match package version")'
          npm run check
          npm test
      - name: Pack the checked source once
        env:
          PACKAGE_DIR: ${{ runner.temp }}/verified-package
        run: |
          mkdir -p "$PACKAGE_DIR"
          npm pack --ignore-scripts --pack-destination "$PACKAGE_DIR"
          cd "$PACKAGE_DIR"
          sha256sum ./*.tgz > SHA256SUMS
      - name: Retain exact verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-verified-package-${{ github.sha }}
          path: ${{ runner.temp }}/verified-package/*
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org
      - name: Download exact verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: claude-verified-package-${{ github.sha }}
          path: verified-package
      - name: Publish the verified tarball without rebuilding
        working-directory: verified-package
        run: |
          sha256sum --check --strict SHA256SUMS
          npm publish ./*.tgz --ignore-scripts --access public --provenance
